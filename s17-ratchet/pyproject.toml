[project]
name = "ratchet"
version = "1.0.0"
description = "A bug report in, a receipt out. Two locked phases on the S17Code engine."
readme = "README.md"
requires-python = ">=3.11"

# S17Code is the engine and is imported, not vendored. It is not on PyPI, so it
# is not listed here: run Ratchet inside S17Code's own environment, or point
# S17CODE_ROOT at the checkout (ratchet/__init__.py puts it on sys.path).
# Everything below is what Ratchet itself adds on top of that environment.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ratchet"]

[tool.ruff]
line-length = 100
target-version = "py311"
